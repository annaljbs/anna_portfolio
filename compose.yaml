services:
  web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      # Live-edit the source from the host…
      - .:/app
      # …but keep the container's own node_modules and build cache.
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      # Uncomment if file changes are not picked up through the bind mount:
      # WATCHPACK_POLLING: "true"
    tty: true
    stdin_open: true
