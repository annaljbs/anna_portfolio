<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6e6e6"/><stop offset="1" stop-color="#8f8f8f"/></linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 0.1"/></feComponentTransfer></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#g)"/>
  <g filter="url(#blur)" fill="#5c5c5c" opacity="0.5"><rect x="240" y="200" width="760" height="480" rx="48"/><circle cx="1260" cy="720" r="200"/></g>
  <rect width="1600" height="1000" filter="url(#grain)"/>
  <text x="800" y="940" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="26" letter-spacing="4" fill="#0e0e0e" fill-opacity="0.45">MEDIA PLACEHOLDER</text>
