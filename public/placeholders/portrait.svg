<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcdcdc"/>
      <stop offset="0.55" stop-color="#b8b8b8"/>
      <stop offset="1" stop-color="#8a8a8a"/>
    </linearGradient>
    <radialGradient id="r" cx="0.5" cy="0.36" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.09"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="900" height="1200" fill="url(#g)"/>
  <rect width="900" height="1200" fill="url(#r)"/>
  <g filter="url(#blur)" fill="#6f6f6f" opacity="0.6">
    <ellipse cx="450" cy="480" rx="150" ry="195"/>
    <path d="M110 1200 C130 870 300 770 450 770 C600 770 770 870 790 1200 Z"/>
  </g>
  <rect width="900" height="1200" filter="url(#grain)"/>
  <text x="450" y="1150" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="18" letter-spacing="2.5" fill="#0e0e0e" fill-opacity="0.45">PORTRAIT PLACEHOLDER</text>
</svg>
